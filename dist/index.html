<html>
    <head>
        <script type="importmap">
            {
             "imports": {
                "vue":"https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.18/vue.esm-browser.min.js",
                "chart":"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js",
                "summernote":"https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote.min.js",
                "components":"./vibrantvue.esm.js"
             }
           }
       </script>
    </head>
    <body>
        <a class="button is-warning has-cursor  is-url"> Warning </a>
        <section>
            <div class="field">
                <input type="checkbox" class="switch is-rounded" name="switchExample" checked="checked"/>
                <label for="switchExample">
                    Allow Friendly URL
                    <span class="help is-danger">*</span>
                </label>
            </div>
        </section>
        <div id="main">
            <Promised :promise="promise">
                <template v-slot="{response}">
                    {{response.toString()}}
                </template>
            </Promised>
            <Promised :promise="promiseError">
                <template v-slot="response">
                    {{response}}
                </template>
            </Promised>
            <Message type="dark" :hasDelete="true" size="large">
                This is a test, this is only a test
            </Message>
            <section>
                <Drop-Down title="test" :items="MyItems"/>
            </section>
            <section>
                <Component-Form :elements="elements" :translate="translate" @value-changed="valueChanged"/>
            </section>
            <hr/>
            <secion>
                <Component-Form :elements="fullElements" :translate="translate" :is_loading="true"/>
            </secion>
            <hr/>

            <section>
                <Card icon="user">
                    <template #header>
                        <p class="card-header-title">
                            Card header
                          </p>
                    </template>
                    <template #content>
                        <div class="content">
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus nec iaculis mauris.
                            <a href="#">@bulmaio</a>. <a href="#">#css</a> <a href="#">#responsive</a>
                            <br>
                            <time datetime="2016-1-1">11:09 PM - 1 Jan 2016</time>
                          </div>
                    </template>
                </Card>
            </section>
            <section>
            <Pagination :currentpage="0" :totalpages="1"/>
        </section>
        <section>
            <Menu>
                <Menu-List>
                    <Menu-Entry :active="true" title="Tasks" icon="list-check" href="#/pages/tasks">
                        <Tag :light="true" type="primary" :rounded="true" class="is-pulled-right">
                            {{ActiveTaskCount}}
                        </Tag>
                    </Menu-Entry>
                </Menu-List>
            </Menu>
        </section>
        <section>
            <Grid v-bind="gridProperites">
                <template #head-username>
                    User Name
                </template>
                <template #body-username="row">
                    {{row.data}}{{row.row.username}}
                </template>
                <template #body-firstname="row">
                    {{row.data}}{{row.row.firstname}}
                </template>
            </Grid>
        </section>
        <section>
            <Progress-Group v-bind="progressGroupProperties"/>
        </section>
        </div>
        <script type="module">
            import { createApp,ref} from "vue";
            import {Message,ComponentForm,Promised,Pagination,Card,Menu,MenuList,MenuEntry,Tag,Grid,DropDown,ColorTypes,ProgressGroup,Sizes} from 'components';

            window.lst = createApp({
                components: { 
                    DropDown,
                    Message,
                    ComponentForm,
                    Promised,
                    Pagination,
                    Card,
                    Menu,
                    MenuList,
                    MenuEntry,
                    Tag,
                    Grid,
                    ProgressGroup
                },
                data:()=>{
                    return {
                        ActiveTaskCount:12,
                        promise:new Promise((resolve)=>{
                            console.log('promise invoked...');
                            setTimeout(()=>resolve('testing'),15*1000)
                        }),
                        promiseError:new Promise((resolve,rejected)=>{
                            console.log('rejected invoked...');
                            setTimeout(()=>rejected('testing'),15*1000)
                        }),
                        elements:[
  {
    "type": "text",
    "subtype": "text",
    "label": "LoginForm.Username",
    "name": "uname",
    "required": true
  },
  {
    "type": "text",
    "subtype": "password",
    "label": "LoginForm.Password",
    "name": "password",
    "required": true
  },
  {
    "type": "date",
    "label": "LoginForm.Password",
    "name": "datetime",
    "includeTime":true,
    "required": true
  },
  {
    "type": "checkbox",
    "label": "LoginForm.Password",
    "name": "check_me",
    "required": true
  }
],
gridProperites:{
    full_width:true,
    total_pages:100,
    current_page:50,
    columns:[
        [{id:'title',title:'People',headerColspan:2,headerOnly:true}],
        [{id:'firstname',propertyName:'firstname',title:'First Name',getCellColor:(rowIndex,row,data)=>{
            if (rowIndex%2===1){return ColorTypes.warning;}
            return null;
        }},{id:'lastname',propertyName:'lastname',title:'Last Name'}],
        [{id:'username',headerColspan:2,dataColspan:2}]
    ],
    data:[
        {firstname:'Bob',lastname:'Loblaw',username:'bob.loblaw'},
        {firstname:'Fred',lastname:'Flintstone',username:'fred.flintstone'}
    ],
    getRowColor:(rowIndex,row)=>{
        if (rowIndex===0){
            return ColorTypes.danger;
        }
        return null;
    }
},
MyItems:[
    {
        children:[
            {title:'test',active:false},
            {title:'test_Active',active:true}
        ]
    },
    {
        children:[
            {title:'test_sub',active:false},
            {title:'test_sub_Active',active:true}
        ]
    }
],
progressGroupProperties:{
    size:Sizes.normal,
    values:[
        {
            type:ColorTypes.success,
            value:20,
            caption:'Completed'
        },
        {
            type:ColorTypes.danger,
            value:15,
            caption:'Failed'
        }
    ],
    max:100
},
fullElements:[
            {
              name:'autocomplete',
              type:"autocomplete",
              label:'autocomplete',
              form_columns:12,
              additional:{
                values:[],
                title:'autocomplete title'
              }
            },
            {
              name:'button',
              type:"button",
              label:'test button',
              form_columns:11,
              additional:{
                icon:'person'
              }
            },
            {
              name:'checkbox-group',
              type:"checkbox-group",
              label:'checkbox group',
              form_columns:10,
              additional:{
                values:[
                  {value:1,label:'one'},
                  {value:2,label:'two'},
                  {value:3,label:'three'},
                  {value:4,label:'four'}
                ]
              }
            },
            {
              name:'checkbox',
              type:"checkbox",
              label:'checkbox label',
              form_columns:9
            },
            {
              name:'date',
              type:"date",
              label:'Date label',
              form_columns:8,
              additional:{
                includeTime:true
              }
            },
            {
              name:'header',
              type:"header",
              label:'Header Label',
              form_columns:7
            },
            {
              name:'number',
              type:"number",
              label:'Number Label',
              form_columns:6,
              additional:{
                min:0,
                max:100,
                step:1
              }
            },
            {
              name:'paragraph',
              type:"paragraph",
              label:'Paragraph content',
              form_columns:5
            },
            {
              name:'radio-group',
              type:"radio-group",
              label:'Radio Group Label',
              form_columns:4,
              additional:{
                values:[
                  {value:1,label:'one'},
                  {value:2,label:'two'},
                  {value:3,label:'three'},
                  {value:4,label:'four'}
                ]
              }
            },
            {
              name:'select',
              type:"select",
              label:'Select Label',
              form_columns:3,
              additional:{
                values:[
                  {value:1,label:'one'},
                  {value:2,label:'two'},
                  {value:3,label:'three'},
                  {value:4,label:'four'}
                ]
              }
            },
            {
              name:'select-multi',
              type:"select",
              label:'Select Multi Label',
              form_columns:3,
              additional:{
                multiple:true,
                values:[
                  {value:1,label:'one'},
                  {value:2,label:'two'},
                  {value:3,label:'three'},
                  {value:4,label:'four'}
                ]
              }
            },
            {
              name:'switch',
              type:"switch",
              label:'switch label',
              form_columns:2
            },
            {
              name:'textarea',
              type:"textarea",
              label:'TextArea Label',
              form_columns:1,
              additional:{
                rows:5,
                cols:50
              }
            },
            {
              name:'time',
              type:"time",
              label:'Time Label'
            },
            {
              name:'subform',
              type:"subform",
              additional:{
                fields:[
                  {
                    name:'time',
                    type:"time",
                    label:'Time Label'
                  }
                ]
              }
            }
          ]
                    };
                }     ,
                methods:{
                    translate :(value)=>{
                        console.log(value);
                        switch(value){
                            case 'LoginForm.Username': return 'Username';
                            case 'LoginForm.Password': return 'Password';
                            default: return value;
                        }
                    },
                    valueChanged:(value)=>{
                        console.log(value);
                    }
                }           
            }).mount('#main');
        </script>
    </body>
</html>
